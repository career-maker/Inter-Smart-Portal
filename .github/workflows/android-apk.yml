name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["mobile/**"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: intersmart-chat-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # Stable public link used by the portal's App Downloads page; every build replaces it.
      - name: Publish to release apk-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk intersmart-portal.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Android app (latest)" --notes "Always the newest build."
          gh release upload apk-latest intersmart-portal.apk --clobber
          gh release edit apk-latest --notes "Built from commit ${GITHUB_SHA::7} on $(date -u +%F)"
